server:
  port: ${EDULAB_SERVER_PORT:8080}
  servlet:
    context-path: /edulab

spring:
  application:
    name: edulab-khtn8
  datasource:
    url: ${EDULAB_DB_URL}
    username: ${EDULAB_DB_USERNAME}
    password: ${EDULAB_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      # CSV imports only; other files still upload directly to storage.
      enabled: true
      resolve-lazily: true
      max-file-size: 1MB
      max-request-size: 2MB
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  web:
    resources:
      cache:
        period: 0

edulab:
  security:
    jwt:
      issuer: edulab-khtn8
      secret: ${EDULAB_JWT_SECRET}
      access-token-minutes: 15
      refresh-token-days: 14
  cookie:
    secure: ${EDULAB_COOKIE_SECURE:true}
    same-site: ${EDULAB_COOKIE_SAME_SITE:Lax}
  upload:
    root: ${EDULAB_UPLOAD_ROOT:./storage}
    max-image-bytes: 5242880
    max-pdf-bytes: 10485760
    dev-scan-bypass: ${EDULAB_DEV_SCAN_BYPASS:false}
  ai:
    # Enabled/key/URL/model/output and daily limits are managed in ai_settings through /admin.
    provider: ${EDULAB_AI_PROVIDER:gatecheap}
    connect-timeout-seconds: 5
    read-timeout-seconds: 45

logging:
  level:
    vn.edu.khtn8: INFO
    org.springframework.security: WARN
