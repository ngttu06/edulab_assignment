spring:
  datasource:
    url: ${EDULAB_DB_URL}
    username: ${EDULAB_DB_USERNAME}
    password: ${EDULAB_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 15000
  flyway:
    enabled: false
  sql:
    init:
      mode: never

edulab:
  security:
    jwt:
      secret: ${EDULAB_JWT_SECRET}
