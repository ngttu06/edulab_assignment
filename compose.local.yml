# Explicit local-development fixture only; never included in the cloud stack.
services:
  mysql:
    image: mysql:8.4
    container_name: edulab-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: edulab_assignment
      MYSQL_USER: edulab
      MYSQL_PASSWORD: edulab_local_password
      MYSQL_ROOT_PASSWORD: root_local_password
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_local_password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
