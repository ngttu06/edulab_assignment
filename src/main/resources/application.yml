server:
  port: ${EDULAB_SERVER_PORT:8080}
  servlet:
    context-path: /edulab

spring:
  application:
    name: edulab-khtn8
  datasource:
    url: ${EDULAB_DB_URL:jdbc:mysql://localhost:3306/edulab_assignment?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${EDULAB_DB_USERNAME:edulab}
    password: ${EDULAB_DB_PASSWORD:edulab_local_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  web:
    resources:
      cache:
        period: 0

edulab:
  security:
    jwt:
      issuer: edulab-khtn8
      secret: ${EDULAB_JWT_SECRET}
      access-token-minutes: 15
      refresh-token-days: 14
  cookie:
    secure: ${EDULAB_COOKIE_SECURE:true}
    same-site: ${EDULAB_COOKIE_SAME_SITE:Lax}
  upload:
    root: ${EDULAB_UPLOAD_ROOT:./storage}
    max-image-bytes: 5242880
    max-pdf-bytes: 10485760
    dev-scan-bypass: ${EDULAB_DEV_SCAN_BYPASS:false}
  ai:
    enabled: ${EDULAB_AI_ENABLED:false}
    daily-request-limit: ${EDULAB_AI_DAILY_REQUEST_LIMIT:20}

logging:
  level:
    vn.edu.khtn8: INFO
    org.springframework.security: WARN
