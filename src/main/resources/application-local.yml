spring:
  datasource:
    # Public-key retrieval is only for the loopback, non-TLS development database.
    url: ${EDULAB_DB_URL:jdbc:mysql://localhost:3306/edulab_assignment?useUnicode=true&characterEncoding=utf8&sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC}

edulab:
  cookie:
    secure: false
  upload:
    dev-scan-bypass: ${EDULAB_DEV_SCAN_BYPASS:false}
